<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Offline – Biozentra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 40px 32px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        max-width: 360px;
        width: 100%;
      }
      .icon { font-size: 48px; margin-bottom: 16px; }
      h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
      p  { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
      button {
        background: #0891b2;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #0e7490; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📶</div>
      <h1>You're offline</h1>
      <p>No internet connection detected. Your data is safely stored on this device — reconnect to sync with the server.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
