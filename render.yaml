services:
  - type: web
    name: biozentra-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biozentra-db
          property: connectionString

databases:
  - name: biozentra-db
    databaseName: biozentra_db
    plan: free
